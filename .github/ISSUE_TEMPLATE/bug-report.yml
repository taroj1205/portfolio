name: Report a problem
description: Something on the site or in a game isn't working
title: "Problem in "
labels: ["bug"]
body:
  - type: input
    id: game
    attributes:
      label: Page or game
      description: The address, like /games/senko
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did and what you saw. A screenshot helps.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: Like iPhone 15 and Safari
