name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: $/.github/workflows/build.yml

  check:
    name: Quality
    uses: $/.github/workflows/quality.yml

  workflow_checks:
    name: Workflow checks
    uses: $/.github/workflows/workflow-checks.yml

  bundle_size:
    name: Bundle size
    needs: build
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: $/.github/workflows/bundle-size.yml

  verify:
    name: Verify
    needs: [build, check, workflow_checks, bundle_size]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify Results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "CI failed - one or more required jobs failed or were cancelled"
            exit 1
          fi

          echo "CI passed"
