name: Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: head/package.json

      - parallel:
          - name: Install current dependencies
            working-directory: head
            run: bun ci
          - name: Install base dependencies
            if: github.event_name == 'pull_request'
            working-directory: base
            run: bun ci
          - name: Cache current Next.js
            uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
            with:
              path: head/.next/cache
              key: ${{ runner.os }}-next-head-${{ hashFiles('head/bun.lock') }}-${{ github.sha }}
              restore-keys: |
                ${{ runner.os }}-next-head-${{ hashFiles('head/bun.lock') }}-
          - name: Cache base Next.js
            if: github.event_name == 'pull_request'
            uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
            with:
              path: base/.next/cache
              key: ${{ runner.os }}-next-base-${{ hashFiles('base/bun.lock') }}-${{ github.event.pull_request.base.sha }}
              restore-keys: |
                ${{ runner.os }}-next-base-${{ hashFiles('base/bun.lock') }}-

      - parallel:
          - name: Build current
            working-directory: head
            run: bun run build
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          - name: Build base
            if: github.event_name == 'pull_request'
            working-directory: base
            run: bun run build
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package bundle data
        if: github.event_name == 'pull_request'
        run: |
          tar -cf "$RUNNER_TEMP/bundle-head.tar" -C head .next/diagnostics/route-bundle-stats.json .next/static
          tar -cf "$RUNNER_TEMP/bundle-base.tar" -C base .next/diagnostics/route-bundle-stats.json .next/static

      - name: Upload bundle data
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-data
          path: |
            ${{ runner.temp }}/bundle-head.tar
            ${{ runner.temp }}/bundle-base.tar
          if-no-files-found: error
          overwrite: true

  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Format
            command: bunx vp fmt --check
          - check: Lint
            command: bunx vp lint
          - check: Typecheck
            command: bunx vp check --no-fmt --no-lint
          - check: Knip
            command: bun run knip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Generate Next.js types
        if: matrix.check == 'Lint' || matrix.check == 'Typecheck'
        run: bunx next typegen

      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun ci

      - name: Run tests
        run: bunx vp test run

  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Spellcheck
        uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          config: cspell.json
